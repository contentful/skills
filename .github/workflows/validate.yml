name: Validate Skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify skills are discoverable
        run: npx -y skills add . --list --full-depth 2>&1 | tee /dev/stderr | grep -q "Found"
